# ProxyTi transparent Minecraft proxy
# Backends need no plugin, mod, forwarding secret, or proxy registration.
bind=0.0.0.0:25565
default-server=lobby

# Set true if ProxyTi should answer server-list pings itself.
intercept-status=false
motd=ProxyTi - Java Edition proxy
max-players=100
connect-timeout-ms=5000

# Optional: send a different host in the backend handshake.
rewrite-handshake-host=false
rewrite-handshake-host-to=localhost
debug=false

# Backend definitions.
server.lobby=127.0.0.1:25566
server.survival=127.0.0.1:25567

# Connect to these backend names by using the corresponding hostname.
# Example: lobby.example.com and survival.example.com DNS both point to the proxy.
forced-host.lobby.example.com=lobby
forced-host.survival.example.com=survival
